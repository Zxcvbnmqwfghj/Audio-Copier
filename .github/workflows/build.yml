name: Build Android APK

on:
  push:
    paths:
      - 'stage3-sources.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Locate project or unpack phone upload
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle.kts ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f audio-copier-source.zip ]; then
            mkdir -p .phone-source
            unzip -q audio-copier-source.zip -d .phone-source
            test -f .phone-source/settings.gradle.kts
            echo "directory=.phone-source" >> "$GITHUB_OUTPUT"
          else
            echo "Upload audio-copier-source.zip to the repository root first."
            exit 1
          fi

      - name: Apply current application sources
        env:
          PROJECT_DIR: ${{ steps.source.outputs.directory }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          manifest = Path('stage3-sources.json')
          if not manifest.exists():
              raise SystemExit('Missing stage3-sources.json; upload the updated source bundle.')
          bundle = json.loads(manifest.read_text())
          root = Path(os.environ['PROJECT_DIR']).resolve()
          for name in bundle['remove']:
              target = (root / name).resolve()
              if not target.is_relative_to(root):
                  raise SystemExit('Invalid source path')
              target.unlink(missing_ok=True)
          for name, content in bundle['files'].items():
              target = (root / name).resolve()
              if not target.is_relative_to(root):
                  raise SystemExit('Invalid source path')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          print('Prepared application version', bundle['version'])
          PYTHON

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Check and build APK
        env:
          PROJECT_DIR: ${{ steps.source.outputs.directory }}
        run: bash "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          compression-level: 0
          name: audio-copier-debug-${{ github.run_number }}
          path: ${{ steps.source.outputs.directory }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.run_number }}
          path: ${{ steps.source.outputs.directory }}/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
